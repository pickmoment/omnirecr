[package]
name = "omnirecr"
version = "0.1.0"
description = "OmniRec - All-in-One Screen and Audio Recorder & Media Merger"
authors = ["OmniRec Team"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "omnirecr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

tokio = { version = "1", features = ["full"] }
cpal = "0.15"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
parking_lot = "0.12"
regex = "1.10"
chromiumoxide = "0.9.1"
futures = "0.3"

[dev-dependencies]
# `tauri::test::mock_app` 용. 녹음 일시정지/재개는 `AppHandle` 이 있을 때만
# 상태 이벤트를 내보내므로, 그 경로(예전에 앱 전체를 얼렸던 자기 교착)를 테스트로
# 재현하려면 실제 `AppHandle` 이 필요하다. dev-dependency 라 릴리스 빌드에는 들어가지 않는다.
tauri = { version = "2.11.3", features = ["macos-private-api", "test"] }
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
screencapturekit = "8.0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
] }
